name: Verify

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact changeset release PR head SHA
        required: true
        type: string
      release_pr_number:
        description: Changeset release PR number
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: verify-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan verification
    if: >-
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/changeset-release/main'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Validate release dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          RELEASE_PR_NUMBER: ${{ inputs.release_pr_number }}
        shell: bash
        run: |
          set -euo pipefail

          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$GITHUB_REF" == "refs/heads/changeset-release/main" ]]
          [[ "$GITHUB_SHA" == "$EXPECTED_HEAD_SHA" ]]

          pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$RELEASE_PR_NUMBER")"
          readarray -t fields < <(
            jq -r '.state, .base.ref, .head.ref, .head.repo.full_name, .head.sha' <<<"$pr_json"
          )

          [[ "${fields[0]}" == "open" ]]
          [[ "${fields[1]}" == "main" ]]
          [[ "${fields[2]}" == "changeset-release/main" ]]
          [[ "${fields[3]}" == "$GITHUB_REPOSITORY" ]]
          [[ "${fields[4]}" == "$EXPECTED_HEAD_SHA" ]]

          current_sha="$(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/changeset-release/main" \
              --jq '.object.sha'
          )"
          [[ "$current_sha" == "$EXPECTED_HEAD_SHA" ]]

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare changeset base branch
        run: git branch --force main origin/main

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check changesets
        if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
        run: pnpm changeset:status

      - name: Select affected packages
        id: affected
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_FORCE_FULL: ${{ github.event_name == 'workflow_dispatch' || github.head_ref == 'changeset-release/main' }}
        run: node scripts/ci-plan.mjs

    outputs:
      full: ${{ steps.affected.outputs.full }}
      has_packages: ${{ steps.affected.outputs.has_packages }}
      matrix: ${{ steps.affected.outputs.matrix }}

  full:
    name: Full verification
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @ilokesto/modal exec playwright install --with-deps chromium

      - name: Build workspace packages and documentation
        run: pnpm build

      - name: Test workspace build graph
        run: pnpm test:monorepo

      - name: Typecheck workspace packages and documentation
        run: pnpm typecheck

      - name: Test workspace packages and documentation
        run: pnpm test

      - name: Test utilinent React 18 runtime
        run: pnpm --filter @ilokesto/utilinent test:react18

      - name: Verify form distribution
        run: pnpm --filter @ilokesto/form test:pack

      - name: Typecheck state tests
        run: pnpm --filter @ilokesto/state test:typecheck

      - name: Test state native storage
        run: pnpm --filter @ilokesto/state test:browser

      - name: Verify modal package
        run: pnpm --filter @ilokesto/modal test:pack

      - name: Test modal end-to-end behavior
        run: pnpm --filter @ilokesto/modal test:e2e

      - name: Test modal accessibility
        run: pnpm --filter @ilokesto/modal test:a11y

      - name: Verify fetcher distribution
        run: pnpm --filter @ilokesto/fetcher test:dist

      - name: Install utilinent browser
        run: pnpm --filter @ilokesto/utilinent exec playwright install --with-deps chromium

      - name: Test utilinent browser contracts
        run: pnpm --filter @ilokesto/utilinent test:browser

  packages:
    name: Package (${{ matrix.package }})
    needs: plan
    if: needs.plan.outputs.full == 'false' && needs.plan.outputs.has_packages == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      PACKAGE: ${{ matrix.package }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package and prerequisites
        run: pnpm --filter "$PACKAGE..." --if-present run build

      - name: Typecheck package
        run: pnpm --filter "$PACKAGE" --if-present run typecheck

      - name: Install docs browser
        if: matrix.package == '@ilokesto/docs'
        run: pnpm --filter @ilokesto/docs exec playwright install --with-deps chromium

      - name: Test package
        run: pnpm --filter "$PACKAGE" --if-present run test

      - name: Test utilinent React 18 runtime
        if: matrix.package == '@ilokesto/utilinent'
        run: pnpm --filter @ilokesto/utilinent test:react18

      - name: Verify form distribution
        if: matrix.package == '@ilokesto/form'
        run: pnpm --filter @ilokesto/form test:pack

      - name: Typecheck state tests
        if: matrix.package == '@ilokesto/state'
        run: pnpm --filter @ilokesto/state test:typecheck

      - name: Install state browser
        if: matrix.package == '@ilokesto/state'
        run: pnpm --filter @ilokesto/state exec playwright install --with-deps chromium

      - name: Test state native storage
        if: matrix.package == '@ilokesto/state'
        run: pnpm --filter @ilokesto/state test:browser

      - name: Install Playwright Chromium
        if: matrix.package == '@ilokesto/modal'
        run: pnpm --filter @ilokesto/modal exec playwright install --with-deps chromium

      - name: Verify modal package
        if: matrix.package == '@ilokesto/modal'
        run: pnpm --filter @ilokesto/modal test:pack

      - name: Test modal end-to-end behavior
        if: matrix.package == '@ilokesto/modal'
        run: pnpm --filter @ilokesto/modal test:e2e

      - name: Test modal accessibility
        if: matrix.package == '@ilokesto/modal'
        run: pnpm --filter @ilokesto/modal test:a11y

      - name: Verify fetcher distribution
        if: matrix.package == '@ilokesto/fetcher'
        run: pnpm --filter @ilokesto/fetcher test:dist

      - name: Install utilinent browser
        if: matrix.package == '@ilokesto/utilinent'
        run: pnpm --filter @ilokesto/utilinent exec playwright install --with-deps chromium

      - name: Test utilinent browser contracts
        if: matrix.package == '@ilokesto/utilinent'
        run: pnpm --filter @ilokesto/utilinent test:browser

  verify:
    name: verify
    needs: [plan, full, packages]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require all selected checks
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          FULL_SELECTED: ${{ needs.plan.outputs.full }}
          HAS_PACKAGES: ${{ needs.plan.outputs.has_packages }}
          FULL_RESULT: ${{ needs.full.result }}
          PACKAGES_RESULT: ${{ needs.packages.result }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PLAN_RESULT" == "success" ]] || exit 1

          case "$FULL_SELECTED:$HAS_PACKAGES" in
            true:true|true:false)
              [[ "$FULL_RESULT" == "success" && "$PACKAGES_RESULT" == "skipped" ]] || exit 1
              ;;
            false:true)
              [[ "$FULL_RESULT" == "skipped" && "$PACKAGES_RESULT" == "success" ]] || exit 1
              ;;
            false:false)
              [[ "$FULL_RESULT" == "skipped" && "$PACKAGES_RESULT" == "skipped" ]] || exit 1
              ;;
            *)
              printf 'Invalid verification plan\n' >&2
              exit 1
              ;;
          esac
